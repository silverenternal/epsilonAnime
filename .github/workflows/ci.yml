name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo build --release
      - run: ./scripts/check_file_lengths.sh
      - name: Coverage
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: coverage-lcov
          path: lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: happybirthday-${{ runner.os }}
          path: target/release/happybirthday*

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m compileall -q backend
      - run: uv run python -m unittest discover -s tests -v
      - run: uv pip check
      - run: uv run --with pip-audit pip-audit

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
