[package]
name = "epsilon_anime"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "MIT"
repository = "https://github.com/silverenternal/epsilonAnime"

[[bin]]
name = "epsilonAnime"
path = "src/main.rs"

[dependencies]
anim_macro = { path = "crates/anim_macro" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
base64 = "0.23"
fastrand = "2.5"
glam = "0.34"
libc = "0.2"
noise = "0.9"
num-complex = "0.4"
portable-pty = "0.9"
puruspe = "0.4"
rayon = "1.12"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sphrs = "0.2"
toml = "0.9"
unicode-width = "0.2"
vt100 = "0.18"
wide = "1.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
proptest = "1.6"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2
debug = 1
