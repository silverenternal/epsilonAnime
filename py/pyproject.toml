[project]
name = "epsilonanime-backend"
version = "0.1.0"
description = "NetEase audio, lyrics, cover and rhythm backend for epsilonAnime"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "silverenternal" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "miniaudio>=1.71,<2",
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.10,<6",
    "pillow>=11,<14",
    "qrcode>=8,<9",
    "requests>=2.32,<3",
]

[tool.uv]
package = false
